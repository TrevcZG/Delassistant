<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delivery Assistant – Zapisz się na listę oczekujących</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0d10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      text-align: center;
    }
    .banner-link {
      display: block;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      transition: transform 0.2s ease;
    }
    .banner-link:hover {
      transform: scale(1.01);
    }
    .banner-link img {
      display: block;
      width: 100%;
      height: auto;
    }
    .info {
      margin-top: 18px;
      font-size: 15px;
      color: #b0b7c3;
    }
    .info a {
      color: #ff7a00;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <a id="banner-link" class="banner-link" href="#">
      <img src="banner.jpg" alt="Delivery Assistant - Zapisz się na listę oczekujących" />
    </a>
    <p class="info">
      Za chwilę nastąpi przekierowanie na stronę zapisów...
      Jeśli nie nastąpi automatycznie, <a id="manual-link" href="#">kliknij tutaj</a>.
    </p>
  </div>

  <script>
    // === KONFIGURACJA ===
    const TARGET_URL = "https://deliveryhelper.pl/"; // 
    // ====================

    
    const params = new URLSearchParams(window.location.search);
    const pathSlug = window.location.pathname.replace(/^\/|\/$/g, "");
    const refId = params.get("id") || pathSlug;

    
    const finalUrl = new URL(TARGET_URL);
    if (refId && refId !== "index.html") {
      finalUrl.searchParams.set("ref", refId);
    }

  
    document.getElementById("banner-link").href = finalUrl.toString();
    document.getElementById("manual-link").href = finalUrl.toString();

    
    setTimeout(() => {
      window.location.href = finalUrl.toString();
    }, REDIRECT_DELAY_MS);
  </script>
</body>
</html>
